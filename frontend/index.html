<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Loan Approval System</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f2f5f9;
            margin: 0;
            padding: 30px;
        }

        .container {
            width: 500px;
            max-width: 100%;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 0 15px rgba(0,0,0,0.15);
        }

        h1 {
            text-align: center;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
        }

        input,
        select {
            width: 100%;
            padding: 11px;
            margin-top: 6px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 15px;
        }

        button {
            width: 100%;
            padding: 13px;
            margin-top: 25px;
            background-color: #2563eb;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background-color: #1d4ed8;
        }

        button:disabled {
            background-color: #999;
            cursor: not-allowed;
        }

        #result {
            text-align: center;
            margin-top: 25px;
            font-size: 18px;
            font-weight: bold;
            line-height: 1.8;
        }

        .approved {
            color: green;
        }

        .rejected {
            color: red;
        }

    </style>

</head>

<body>

<div class="container">

    <h1>🏦 Loan Approval System</h1>

    <form id="loanForm">

        <!-- BANK -->

        <label>🏦 Select Bank</label>

        <select id="bank_name" required>

            <option value="State Bank of India">
                State Bank of India
            </option>

            <option value="HDFC Bank">
                HDFC Bank
            </option>

            <option value="ICICI Bank">
                ICICI Bank
            </option>

            <option value="Axis Bank">
                Axis Bank
            </option>

            <option value="Kotak Mahindra Bank">
                Kotak Mahindra Bank
            </option>

            <option value="Punjab National Bank">
                Punjab National Bank
            </option>

            <option value="Bank of Baroda">
                Bank of Baroda
            </option>

            <option value="Canara Bank">
                Canara Bank
            </option>

        </select>


        <!-- GENDER -->

        <label>Gender</label>

        <select id="gender">

            <option value="Male">
                Male
            </option>

            <option value="Female">
                Female
            </option>

        </select>


        <!-- MARRIED -->

        <label>Married</label>

        <select id="married">

            <option value="Yes">
                Yes
            </option>

            <option value="No">
                No
            </option>

        </select>


        <!-- DEPENDENTS -->

        <label>Dependents</label>

        <select id="dependents">

            <option value="0">
                0
            </option>

            <option value="1">
                1
            </option>

            <option value="2">
                2
            </option>

            <option value="3+">
                3+
            </option>

        </select>


        <!-- EDUCATION -->

        <label>Education</label>

        <select id="education">

            <option value="Graduate">
                Graduate
            </option>

            <option value="Not Graduate">
                Not Graduate
            </option>

        </select>


        <!-- SELF EMPLOYED -->

        <label>Self Employed</label>

        <select id="self_employed">

            <option value="No">
                No
            </option>

            <option value="Yes">
                Yes
            </option>

        </select>


        <!-- INCOME -->

        <label>Applicant Income</label>

        <input
            type="number"
            id="applicant_income"
            min="0"
            required
        >


        <!-- COAPPLICANT -->

        <label>Coapplicant Income</label>

        <input
            type="number"
            id="coapplicant_income"
            value="0"
            min="0"
            required
        >


        <!-- LOAN AMOUNT -->

        <label>Loan Amount</label>

        <input
            type="number"
            id="loan_amount"
            min="0"
            required
        >


        <!-- LOAN TERM -->

        <label>Loan Amount Term</label>

        <select id="loan_term">

            <option value="360">
                360 months
            </option>

            <option value="180">
                180 months
            </option>

            <option value="240">
                240 months
            </option>

            <option value="120">
                120 months
            </option>

            <option value="60">
                60 months
            </option>

        </select>


        <!-- CREDIT -->

        <label>Credit History</label>

        <select id="credit_history">

            <option value="1">
                Good
            </option>

            <option value="0">
                Bad
            </option>

        </select>


        <!-- PROPERTY -->

        <label>Property Area</label>

        <select id="property_area">

            <option value="Urban">
                Urban
            </option>

            <option value="Semiurban">
                Semiurban
            </option>

            <option value="Rural">
                Rural
            </option>

        </select>


        <button
            type="submit"
            id="submitButton">

            CHECK LOAN

        </button>

    </form>


    <div id="result"></div>

</div>


<script>

const API_URL =
    "http://127.0.0.1:5000";


document.getElementById("loanForm")
.addEventListener(
    "submit",
    async function(event) {

        event.preventDefault();


        const button =
            document.getElementById(
                "submitButton"
            );

        const resultBox =
            document.getElementById(
                "result"
            );


        button.disabled = true;

        button.innerText =
            "Checking...";


        resultBox.innerHTML =
            "⏳ Processing application...";


        const applicant = {

            bank_name:
                document.getElementById(
                    "bank_name"
                ).value,

            gender:
                document.getElementById(
                    "gender"
                ).value,

            married:
                document.getElementById(
                    "married"
                ).value,

            dependents:
                document.getElementById(
                    "dependents"
                ).value,

            education:
                document.getElementById(
                    "education"
                ).value,

            self_employed:
                document.getElementById(
                    "self_employed"
                ).value,

            applicant_income:
                Number(
                    document.getElementById(
                        "applicant_income"
                    ).value
                ),

            coapplicant_income:
                Number(
                    document.getElementById(
                        "coapplicant_income"
                    ).value
                ),

            loan_amount:
                Number(
                    document.getElementById(
                        "loan_amount"
                    ).value
                ),

            loan_term:
                Number(
                    document.getElementById(
                        "loan_term"
                    ).value
                ),

            credit_history:
                Number(
                    document.getElementById(
                        "credit_history"
                    ).value
                ),

            property_area:
                document.getElementById(
                    "property_area"
                ).value

        };


        console.log(
            "Sending application:",
            applicant
        );


        try {

            const response =
                await fetch(
                    API_URL + "/predict",
                    {

                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body:
                            JSON.stringify(
                                applicant
                            )

                    }
                );


            const result =
                await response.json();


            console.log(
                "Server response:",
                result
            );


            if (!response.ok) {

                throw new Error(
                    result.error ||
                    "Server returned an error"
                );

            }


            const prediction =
                result.prediction;

            const probability =
                result.probability;

            const applicationId =
                result.application_id;


            if (
                prediction ===
                "Approved"
            ) {

                resultBox.innerHTML = `

                    <div class="approved">

                        🎉 LOAN APPROVED!

                        <br><br>

                        🏦 Bank:
                        <b>${result.bank_name}</b>

                        <br>

                        Prediction:
                        <b>${prediction}</b>

                        <br>

                        Approval Probability:
                        <b>${probability}%</b>

                        <br>

                        Application ID:
                        <b>${applicationId}</b>

                        <br><br>

                        ✅ Application saved!

                    </div>

                `;

            } else {

                resultBox.innerHTML = `

                    <div class="rejected">

                        ❌ LOAN REJECTED!

                        <br><br>

                        🏦 Bank:
                        <b>${result.bank_name}</b>

                        <br>

                        Prediction:
                        <b>${prediction}</b>

                        <br>

                        Approval Probability:
                        <b>${probability}%</b>

                        <br>

                        Application ID:
                        <b>${applicationId}</b>

                        <br><br>

                        ✅ Application saved!

                    </div>

                `;

            }


        }

        catch(error) {

            console.error(
                "Prediction error:",
                error
            );


            resultBox.innerHTML = `

                ❌ Unable to process application.

                <br><br>

                ${error.message}

            `;

        }

        finally {

            button.disabled = false;

            button.innerText =
                "CHECK LOAN";

        }

    }

);

</script>

</body>

</html>
